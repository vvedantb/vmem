name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: boat
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # The pnpm store, with a fallback key: after a lockfile change the last
      # store is restored and only the changed packages are downloaded.
      - name: Find the pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-${{ runner.arch }}-
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: "0"
      # A store restored from the fallback key still holds packages the new
      # lockfile dropped: remove them before the store is saved.
      - name: Prune the pnpm store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm store prune
      # Each step runs even if an earlier one failed, so one run shows every failure.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck:all
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: React Compiler bailouts
        if: ${{ !cancelled() }}
        run: node scripts/compiler-check.mjs
      # Tests run in CI now that source-text tests are gone (lint rule
      # vmem/no-source-text-in-tests keeps them out). Every test calls real code.
      - name: Tests
        if: ${{ !cancelled() }}
        run: pnpm test
      - name: Oxlint plugin tests
        if: ${{ !cancelled() }}
        run: pnpm test:oxlint-plugin
