name: CI

# Thin caller of the shared vvedantb/packages ci-app workflow. The shared
# workflow owns checkout, Node, pnpm, the store cache and install, and runs
# every command even after an earlier one fails, so one run shows every failure.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests share a group per ref and cancel older runs. Each main run
# gets its own group (github.run_id), so a newer pending main run never
# replaces an older pending one: that would drop a release the older run
# carries.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: vvedantb/packages/.github/workflows/ci-app.yml@main
    with:
      runs_on: ubuntu-latest
      node_version: "22"
      fetch_depth: 0
      parallel: true
      # ubuntu-latest has 4 vCPUs. Cap concurrent commands at 2 so parallel
      # commands and vitest workers do not oversubscribe the runner. All-at-once
      # and higher caps made heavy convex tests hit the 5 s default timeout.
      max_parallel: 2
      affected_tests: true
      full_run_paths: |
        packages/backend/tests/frontiermemory/fixtures/
        packages/backend/eval/e2e-ab/fixtures/
        packages/backend/eval/frontiermemory/tasks\.json
      commands: |
        pnpm typecheck:all
        pnpm lint
        node scripts/compiler-check.mjs
        pnpm --filter @vmem/backend exec vitest run --maxWorkers=2 $VV_TEST_CHANGED ${VV_TEST_CHANGED:+--passWithNoTests}
        pnpm --filter web exec vitest run --maxWorkers=2 $VV_TEST_CHANGED ${VV_TEST_CHANGED:+--passWithNoTests}
        pnpm --filter @vmem/chrome-extension test
        pnpm --filter @vmem/desktop test
        pnpm --filter @vmem/mobile test
        pnpm --filter @vmem/sdk test
        pnpm test:oxlint-plugin

  # The Android release runs in parallel with check, on pushes to main only.
  # Pull requests never release. It uses a second runner, so the APK build
  # (the slow part) overlaps the checks instead of waiting for them.
  #
  # The shared workflow owns both gates. `pathspecs` lists the files that go
  # into the APK. The shared workflow diffs the push against its base and
  # starts the build only when one of them changed. The commit message does
  # not matter: release_on is always. `wait_for_check_job` names the check job
  # above ("Check"). The build starts at once, but the shared workflow
  # publishes only after Check succeeds. If Check fails, nothing publishes.
  #
  # The pathspec list is the APK input list. A positive `x/**` is ':(glob)x/**',
  # a plain file is a root-anchored ':(glob)file', and a negative is an
  # ':(exclude,glob)y'. It holds only what goes into the APK: the mobile app,
  # the workspace code that Metro bundles into it, and the install and build
  # inputs. Excluded: web, chrome-extension, desktop, docs, .github/** (so a
  # CI-only merge never releases) and the Convex backend. The app reaches vmem
  # over HTTP with @vmem/sdk only; @vmem/sdk has no workspace dependencies.
  # pnpm-lock.yaml and the root package.json are not listed: they have no
  # per-app part, so every dependency change anywhere in the repo would
  # release. A mobile dependency change edits apps/mobile/package.json, which
  # apps/mobile/** matches.
  #
  # The job-level concurrency group is shared with release-android.yml, so push
  # and dispatch releases serialise. version and dry_run are dropped: on push
  # they are empty and false.
  release:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-android
      cancel-in-progress: false
    uses: vvedantb/packages/.github/workflows/release-android-apk.yml@main
    with:
      app_name: vmem
      package_id: com.projectvdotuk.vmem
      # The pathspecs input is the only gate. Without this, the shared
      # workflow also needs a feat commit or [release] on a push.
      release_on: always
      wait_for_check_job: Check
      pathspecs: |
        :(glob)apps/mobile/**
        :(exclude,glob)apps/mobile/tests/**
        :(exclude,glob)apps/mobile/**/*.md
        :(exclude,glob)apps/mobile/.env.example
        :(glob)packages/sdk/package.json
        :(glob)packages/sdk/src/**
        :(exclude,glob)packages/sdk/**/*.test.ts
        :(glob)pnpm-workspace.yaml
        :(glob).npmrc
        :(glob)scripts/build-android-release.sh
        :(glob)scripts/android-release.config.json
      # A boat.dev runner. It has no Android SDK: the shared workflow installs
      # the command line tools and sdk_packages when it finds none.
      runs_on: boat-large
      # The shared workflow does not install dependencies before the build
      # script, and the build script runs a bin from @vvedantb/config.
      pre_build_command: |
        pnpm install --frozen-lockfile --filter '@vmem/mobile...' --filter '{.}'
    secrets: inherit
