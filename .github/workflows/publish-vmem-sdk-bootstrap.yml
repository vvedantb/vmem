# One-time bootstrap: creates @vmem/sdk on npm using NPM_TOKEN.
# After success: configure Trusted Publishing on npm, then use publish-vmem-sdk.yml only.
# Safe to re-run only while the package version is not yet on the registry.
name: Bootstrap @vmem/sdk on npm

on:
    workflow_dispatch:

jobs:
    bootstrap:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14"
                  registry-url: "https://registry.npmjs.org"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm --filter @vmem/sdk build

            - name: Publish with NPM_TOKEN
              working-directory: packages/sdk
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_GIT_CHECKS: "false"
              run: npm publish --access public
