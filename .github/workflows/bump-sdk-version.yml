# Bumps @vmem/sdk patch version when SDK source changes land on main.
# The version commit triggers publish-vmem-sdk.yml (package.json path).
name: Bump SDK version

on:
    push:
        branches:
            - main
        paths:
            - "packages/sdk/src/**"
            - "packages/sdk/README.md"
            - "packages/sdk/tsconfig.json"

concurrency:
    group: bump-sdk-version
    cancel-in-progress: false

jobs:
    bump:
        if: >-
            !contains(github.event.head_commit.message, '[skip sdk release]') &&
            !startsWith(github.event.head_commit.message, 'chore(sdk): release')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14"

            - name: Bump patch version
              working-directory: packages/sdk
              run: npm version patch --no-git-tag-version

            - name: Commit and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add packages/sdk/package.json
                  VERSION=$(node -p "require('./packages/sdk/package.json').version")
                  git commit -m "chore(sdk): release ${VERSION}"
                  git pull --rebase origin main
                  git push
