name: Release Chrome Extension

# Push to main on the paths below → pick the next version, build, zip, upload +
# publish to the Chrome Web Store, create the tag `extension-vX.Y.Z` at the merge
# commit and attach the zip to its GitHub Release.
# Tag push `extension-vX.Y.Z` → the same release for that tag. The source version
# must match the tag.
# Manual dispatch on a branch → build + zip + workflow artifact only (no CWS publish).
# Manual dispatch on an `extension-v*` tag behaves like a tag push.
# Manual dispatch with dry_run → pick the version as a release from main does,
# build + zip + workflow artifact only. Publishes nothing, on any ref.
# The tag that a main release creates is made with GITHUB_TOKEN, so it starts no
# second run.
#
# Chrome Web Store limits for a release on every merge:
# - The store takes a version only if it is higher than the last upload. The
#   picked version is higher than every `extension-v*` tag, but the job cannot
#   see a version that was uploaded by hand.
# - While an earlier upload is in review, the store refuses a new upload and the
#   job fails at the upload step. No tag is made, so the next release from main
#   picks the same version again and carries those changes.

on:
  push:
    branches: [main]
    tags:
      - "extension-v*"
    # GitHub checks these paths for branch pushes only; a tag push always runs.
    # Only what goes into the zip: the extension, the @vmem/shared source it
    # bundles, the two @vmem/backend files it bundles (index.ts and the
    # generated api.js, which is a fixed proxy; the rest of the backend gives
    # types only), and the install and build inputs. Excluded: tests, docs,
    # .env.example and .github/** (so a CI-only merge never releases).
    # pnpm-lock.yaml and the root package.json are not listed: they have no
    # per-app part, so every dependency change anywhere in the repo would
    # release. An extension dependency change edits
    # apps/chrome-extension/package.json, which apps/chrome-extension/** matches.
    paths:
      - "apps/chrome-extension/**"
      - "!apps/chrome-extension/tests/**"
      - "!apps/chrome-extension/**/*.md"
      - "!apps/chrome-extension/.env.example"
      - "packages/shared/package.json"
      - "packages/shared/src/**"
      - "!packages/shared/**/*.test.ts"
      - "packages/backend/index.ts"
      - "packages/backend/convex/_generated/api.js"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pick the version and build as a release from main does, but skip the Chrome Web Store and the GitHub Release."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, never cancelled while it runs. The version is picked
# inside the job, so a queued run sees the tag that the run before it created.
# GitHub keeps only the newest pending run; that run builds the newest main, so
# it includes the skipped merges.
concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ (startsWith(github.ref, 'refs/tags/extension-v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && inputs.dry_run != true }}
      PICK_VERSION: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.dry_run == true }}
      REF_NAME: ${{ github.ref_name }}
      EXT_DIR: apps/chrome-extension/dist/chrome-mv3
    steps:
      - name: Check Chrome Web Store secrets
        if: env.PUBLISH == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          missing=""
          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_EXTENSION_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Note build-only run
        if: env.PUBLISH != 'true'
        run: echo "::notice::Ref '$REF_NAME' is a dry run or a manual run that is not on an extension-v* tag. Build + artifact only; Chrome Web Store publish skipped."

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Sets the release tag. A release from main (or a dry run) gets the next
      # version (.github/scripts/pick-release-version.sh), written into
      # package.json and wxt.config.ts in this workspace, so the built manifest
      # carries it. Nothing is committed. A tag release keeps its tag and the
      # source version. A build-only run has no tag.
      - name: Pick version
        id: pick
        run: |
          set -euo pipefail
          if [ "$PICK_VERSION" != "true" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            else
              echo "tag=" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          source_version="$(jq -r .version apps/chrome-extension/package.json)"
          version="$(bash .github/scripts/pick-release-version.sh extension-v "$source_version")"
          cd apps/chrome-extension
          jq --arg v "$version" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          line='^([[:space:]]*version: )"[0-9.]+",$'
          count="$(grep -cE "$line" wxt.config.ts || true)"
          if [ "$count" != "1" ]; then
            echo "::error::Expected one manifest version line in wxt.config.ts, found $count."
            exit 1
          fi
          sed -i -E "s/$line/\\1\"$version\",/" wxt.config.ts
          grep -nE "$line" wxt.config.ts
          echo "tag=extension-v$version" >> "$GITHUB_OUTPUT"

      # Production values. Publishable keys and the Convex URL are public by design.
      - name: Build extension
        env:
          VITE_CONVEX_URL: https://clear-bear-690.eu-west-1.convex.cloud
          VITE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucHJvamVjdHYudWsk
          VITE_CLERK_SYNC_HOST: https://vmem.projectv.uk
        run: pnpm ext:build

      - name: Check version
        id: version
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          manifest_version="$(jq -r .version "$EXT_DIR/manifest.json")"
          package_version="$(jq -r .version apps/chrome-extension/package.json)"
          echo "manifest.json version: $manifest_version"
          echo "package.json version:  $package_version"
          if [ "$manifest_version" != "$package_version" ]; then
            echo "::error::Built manifest version ($manifest_version) does not match package.json ($package_version). Bump both package.json and wxt.config.ts manifest.version."
            exit 1
          fi
          if [ -n "$TAG" ]; then
            tag_version="${TAG#extension-v}"
            if [ "$tag_version" != "$manifest_version" ]; then
              echo "::error::Tag $TAG expects version $tag_version, but built manifest.json has $manifest_version."
              exit 1
            fi
          fi
          echo "value=$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        id: zip
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          zip_path="$GITHUB_WORKSPACE/vmem-chrome-extension-$VERSION.zip"
          (cd "$EXT_DIR" && zip -r -q "$zip_path" .)
          ls -l "$zip_path"
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vmem-chrome-extension-${{ steps.version.outputs.value }}
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      # Upload + publish with plain curl. Visibility is not set, so the item keeps
      # its current store visibility (unlisted). Tokens are never printed.
      - name: Upload and publish to Chrome Web Store
        if: env.PUBLISH == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail
          api="https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID"
          upload_api="https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID"

          echo "Exchanging refresh token for access token"
          status="$(curl -sS -o token.json -w '%{http_code}' \
            -X POST https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          access_token="$(jq -r '.access_token // empty' token.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ -z "$access_token" ]; then
            echo "::error::OAuth token exchange failed (HTTP $status)"
            jq '{error, error_description}' token.json || true
            rm -f token.json
            exit 1
          fi
          rm -f token.json
          echo "::add-mask::$access_token"

          echo "Uploading $(basename "$ZIP_PATH")"
          status="$(curl -sS -o upload.json -w '%{http_code}' \
            -X PUT "$upload_api" \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP_PATH")"
          cat upload.json
          upload_state="$(jq -r '.uploadState // empty' upload.json)"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] || [ "$upload_state" != "SUCCESS" ] \
            || jq -e '(.error != null) or ((.itemError // []) | length > 0)' upload.json >/dev/null; then
            echo "::error::Chrome Web Store upload failed (HTTP $status, uploadState '$upload_state')"
            exit 1
          fi

          echo "Publishing (publishTarget=default, visibility unchanged)"
          status="$(curl -sS -o publish.json -w '%{http_code}' \
            -X POST "$api/publish?publishTarget=default" \
            -H "Authorization: Bearer $access_token" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0")"
          cat publish.json
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ] \
            || jq -e '.error // empty' publish.json >/dev/null \
            || ! jq -e '(.status // []) | all(. == "OK" or . == "ITEM_PENDING_REVIEW") and length > 0' publish.json >/dev/null; then
            echo "::error::Chrome Web Store publish failed (HTTP $status)"
            exit 1
          fi
          echo "Published. Status: $(jq -c .status publish.json)"

      # On a release from main the tag does not exist yet, so
      # `gh release create --target` makes it at the merge commit.
      - name: Attach zip to GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP_PATH" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ZIP_PATH" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "vmem Chrome extension $TAG" --generate-notes
          fi
