# Publishes @vmem/sdk via npm Trusted Publishing (OIDC).
# npm: @vmem/sdk → Trusted publishing → vedantb2/vmem, publish-vmem-sdk.yml
name: Publish VMemory SDK

on:
    push:
        branches:
            - main
        paths:
            - "packages/sdk/package.json"
            - ".github/workflows/publish-vmem-sdk.yml"
    workflow_dispatch:

concurrency:
    group: publish-vmem-sdk
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  cache: pnpm
                  package-manager-cache: false

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm --filter @vmem/sdk build

            - name: Upgrade npm for trusted publishing
              run: |
                  npm install -g npm@latest
                  npm --version
                  node --version

            - name: Publish to npm
              working-directory: packages/sdk
              env:
                  NPM_CONFIG_GIT_CHECKS: "false"
                  NODE_AUTH_TOKEN: ""
              run: |
                  npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
                  npm config delete //registry.npmjs.org/:_authToken --location=project 2>/dev/null || true
                  npm publish --access public
