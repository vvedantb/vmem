# Publishes @vmem/sdk via npm Trusted Publishing (OIDC).
# One-time: first publish must create the package on npm (see apps/docs/sdk/publishing.mdx).
# Then: @vmem/sdk → Settings → Trusted publishing → vedantb2/vmem, publish-vmem-sdk.yml
name: Publish VMemory SDK

on:
    push:
        branches:
            - main
        paths:
            - "packages/sdk/package.json"
            - ".github/workflows/publish-vmem-sdk.yml"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm --filter @vmem/sdk build

            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@latest

            - name: Publish to npm
              working-directory: packages/sdk
              env:
                  NPM_CONFIG_GIT_CHECKS: "false"
              run: |
                  npm config delete //registry.npmjs.org/:_authToken --location=user 2>/dev/null || true
                  npm publish --access public
