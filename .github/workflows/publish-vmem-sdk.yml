# Publishes @vmem/sdk via npm Trusted Publishing (OIDC).
# One-time npm setup: @vmem/sdk → Settings → Trusted publishing → GitHub Actions
#   Repository: vedantb2/vmem
#   Workflow: publish-vmem-sdk.yml
# No NPM_TOKEN secret required on the publish step.
name: Publish VMemory SDK

on:
    push:
        branches:
            - main
        paths:
            - "packages/sdk/package.json"
            - ".github/workflows/publish-vmem-sdk.yml"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22.14"
                  registry-url: "https://registry.npmjs.org"
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm --filter @vmem/sdk build

            - name: Upgrade npm for trusted publishing
              run: npm install -g npm@latest

            - name: Publish to npm
              working-directory: packages/sdk
              run: npm publish --access public --no-git-checks
