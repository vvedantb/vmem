name: Dependency Lint

on:
  pull_request:
    paths:
      - "**/package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - ".syncpackrc.json"

jobs:
  lint-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:deps
      - run: pnpm check:expo
