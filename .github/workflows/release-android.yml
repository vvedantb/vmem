name: Release Android APK

# Thin caller of the shared vvedantb/packages release-android-apk workflow.
# It builds the signed vmem Android sideload APK and publishes it as a GitHub
# Release. dry_run builds and signs the APK but publishes nothing. Secrets and
# versions: apps/mobile/RELEASE.md.
#
# Manual dispatch only. Push releases on main run inside the CI run
# (.github/workflows/ci.yml). There, the release job passes `pathspecs` (the
# APK input list) and `wait_for_check_job` to the same shared workflow, so it
# builds in parallel with Check and publishes only after Check succeeds. This
# file sets neither input: a dispatch run has no Check sibling to wait for and
# no push diff to filter. It is the entry point for an on-demand or dry-run
# build.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "versionName, like 1.0.1. Leave empty to bump the patch of the highest published release.json versionName (at least DEFAULT_VERSION_NAME in app.config.ts)."
        required: false
        type: string
      dry_run:
        description: "Build and sign the APK, but skip gh release create (no tag, no release)."
        required: false
        type: boolean
        default: false

# actions: read is required by the pinned shared workflow (aa70acf, packages
# #321). A called workflow cannot raise permissions above the caller. Without
# it, the run fails at startup, even though this dispatch caller does not set
# wait_for_check_job.
permissions:
  actions: read
  contents: write

# One release at a time, for push and dispatch runs. The version is chosen
# inside the job, so a queued run sees the release that the run before it
# published. GitHub keeps only the newest pending run and cancels older
# pending ones. The newest run builds the newest main, so it includes the
# skipped merges.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    # Pin: #320 follow-up with actions:read for wait_for_check_job (and fetch-depth fix). Return to @main after it lands.
    uses: vvedantb/packages/.github/workflows/release-android-apk.yml@aa70acf92cee5aa5b58723aa2f7180c4c14f6192
    with:
      app_name: vmem
      package_id: com.projectvdotuk.vmem
      version: ${{ inputs.version }}
      # On push, inputs.dry_run is empty, so compare to true for a boolean.
      dry_run: ${{ inputs.dry_run == true }}
      # A boat.dev runner. It has no Android SDK: the shared workflow installs
      # the command line tools and sdk_packages when it finds none.
      runs_on: boat-large
      # The shared workflow does not install dependencies before the build
      # script, and the build script runs a bin from @vvedantb/config.
      pre_build_command: |
        pnpm install --frozen-lockfile --filter '@vmem/mobile...' --filter '{.}'
    secrets: inherit
