name: Release Android APK

# Builds the signed vmem Android tracker sideload APK with Gradle (no EAS, no
# EXPO_TOKEN) and publishes it with release.json as a GitHub Release tagged
# mobile-apk-<versionName>. V Store installs it from there. dry_run builds and
# signs the APK but publishes nothing. The sideload key is not a Google Play key.
#
# A merge to main that changes what the APK is built from publishes a release
# with the next patch version. Manual dispatch still works. Secrets and
# versions: apps/mobile/RELEASE.md.
on:
  push:
    branches: [main]
    # Only what goes into the APK: the mobile app, the workspace code that
    # Metro bundles into it, and the install and build inputs. Excluded:
    # web, chrome-extension, desktop, docs, .github/** (this workflow and the
    # notes template, so a CI-only merge never releases) and the Convex
    # backend. The app reaches vmem over HTTP with @vmem/sdk only; @vmem/sdk
    # has no workspace dependencies. pnpm-lock.yaml has no per-app part, so
    # any dependency change releases.
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/tests/**"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/.env.example"
      - "packages/sdk/package.json"
      - "packages/sdk/src/**"
      - "!packages/sdk/**/*.test.ts"
      # Root package.json holds the packageManager pin and pnpm settings.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "scripts/build-android-release.sh"
  # On push, inputs.* are empty: automatic version, not a dry run, publish.
  workflow_dispatch:
    inputs:
      version:
        description: "versionName, like 1.0.1. Leave empty to bump the patch of the highest published release.json versionName (at least DEFAULT_VERSION_NAME in app.config.ts)."
        required: false
        type: string
      dry_run:
        description: "Build and sign the APK, but skip gh release create (no tag, no release)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, for push and dispatch runs. The version is chosen
# inside the job, so a queued run sees the release that the run before it
# published. GitHub keeps only the newest pending run and cancels older
# pending ones. The newest run builds the newest main, so it includes the
# skipped merges.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        # -eo pipefail, unlike the default shell.
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Choose versionName, versionCode and tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          # DEFAULT_VERSION_NAME in app.config.ts is the versionName floor.
          app_config=apps/mobile/app.config.ts
          app_version="$(sed -n -E 's/^const DEFAULT_VERSION_NAME = "([^"]*)";$/\1/p' "$app_config")"
          if ! [[ "$app_version" =~ $semver ]]; then
            echo "::error::Could not read the DEFAULT_VERSION_NAME literal from $app_config."
            exit 1
          fi

          # Highest versionName and versionCode in published mobile-apk-*
          # release.json files. A release without release.json (before this
          # workflow) counts as versionCode 1. Any other gh error stops the
          # run rather than undercounting.
          # releases has a "versionName tag" line for each release.json, so
          # the release notes can start from the highest published version.
          names="$app_version"
          releases=""
          highest_code=0
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 \
            --json tagName --jq '.[].tagName | select(startswith("mobile-apk-"))')"
          for tag in $tags; do
            manifest="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[] | select(.name == "release.json") | .name')"
            if [ -z "$manifest" ]; then
              code=1
            else
              release_json="$(gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern release.json --output -)"
              code="$(jq -r '.versionCode // empty' <<<"$release_json")"
              name="$(jq -r '.versionName // empty' <<<"$release_json")"
              if ! [[ "$code" =~ ^[0-9]+$ ]]; then
                echo "::error::$tag release.json has no valid versionCode."
                exit 1
              fi
              # A legacy release with a non-semver versionName still counts
              # for versionCode, but not for versionName or release notes.
              if [[ "$name" =~ $semver ]]; then
                names="$names"$'\n'"$name"
                releases="$releases"$'\n'"$name $tag"
              else
                echo "::warning::$tag release.json versionName '$name' is not like 1.0.1. Ignored for versionName."
              fi
            fi
            if [ "$code" -gt "$highest_code" ]; then
              highest_code="$code"
            fi
          done

          if [ -n "$INPUT_VERSION" ]; then
            version_name="$INPUT_VERSION"
            if ! [[ "$version_name" =~ $semver ]]; then
              echo "::error::version must look like 1.0.1."
              exit 1
            fi
          else
            highest_name="$(sort -V <<<"$names" | tail -n 1)"
            IFS=. read -r major minor patch <<<"$highest_name"
            version_name="$major.$minor.$((patch + 1))"
          fi

          # Sideload versionCodes start at 1000, apart from local builds
          # (DEFAULT_VERSION_CODE in app.config.ts).
          version_code=$((highest_code + 1))
          if [ "$version_code" -lt 1000 ]; then
            version_code=1000
          fi

          tag="mobile-apk-$version_name"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Tag $tag already exists without a release. Delete it or choose another version."
            exit 1
          fi

          # The release with the highest semver versionName. GitHub's "latest
          # release" is another product's release in this repo.
          previous_tag="$(sort -V <<<"$releases" | tail -n 1 | cut -s -d ' ' -f 2)"

          echo "Releasing $tag: versionName $version_name, versionCode $version_code (highest release: $highest_code, floor: 1000). Previous release: ${previous_tag:-none}"
          {
            echo "previous_tag=$previous_tag"
            echo "tag=$tag"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Release builds never fall back to the debug key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/vmem-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      # Version from packageManager in the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The runner image has the Android SDK at $ANDROID_HOME with current
      # cmdline-tools. android-actions/setup-android@v3 swaps in older ones and
      # installs the removed "tools" package, so it is not used. Install what
      # React Native 0.86 pins, and AGP's default CMake, before Gradle needs it.
      - name: Install Android SDK packages
        run: |
          # Ubuntu runners set ANDROID_HOME. Set it and ANDROID_SDK_ROOT to the
          # same SDK for later steps, so the build script (which prefers
          # ANDROID_SDK_ROOT) uses the SDK these packages go into.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk" ] || [ ! -d "$sdk" ]; then
            echo "::error::ANDROID_HOME and ANDROID_SDK_ROOT do not point to an Android SDK. This workflow needs a runner image with the Android SDK."
            exit 1
          fi
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"

          # cmdline-tools/latest, else the highest versioned cmdline-tools/<n.n>
          # (an image may have only, say, cmdline-tools/16.0).
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager=""
            while IFS= read -r dir; do
              dir="${dir%/}"
              if [[ "${dir##*/}" =~ ^[0-9]+(\.[0-9]+)*$ ]] && [ -x "$dir/bin/sdkmanager" ]; then
                sdkmanager="$dir/bin/sdkmanager"
              fi
            done < <(ls -d "$sdk"/cmdline-tools/*/ 2>/dev/null | sort -V)
          fi
          if [ -z "$sdkmanager" ]; then
            echo "::error::No sdkmanager in $sdk/cmdline-tools/latest or a versioned cmdline-tools folder."
            exit 1
          fi
          echo "Using $sdkmanager"

          # yes dies of SIGPIPE when sdkmanager stops reading; that is not a failure.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install platform-tools "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.1.12297006" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      # The script installs the mobile workspace deps and bakes the production
      # EXPO_PUBLIC_* defaults committed in apps/mobile/src/config.ts.
      - name: Build signed APK
        id: build
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./scripts/build-android-release.sh

      - name: Publish GitHub Release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.build.outputs.apk }}
          RELEASE_JSON: ${{ steps.build.outputs.release_json }}
          VERSION_NAME: ${{ steps.build.outputs.version_name }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
          # Empty on push, so a push run always publishes.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          sed -e "s/{{versionName}}/$VERSION_NAME/g" \
            -e "s/{{versionCode}}/$VERSION_CODE/g" \
            -e "s/{{sha256}}/$SHA256/g" \
            .github/android-release-notes.md > "$notes"

          # Merged PR titles since the previous release of this app. They are
          # appended after sed, so no title can change the template. A
          # failure only drops this section; the release still publishes.
          notes_args=(-f tag_name="$TAG" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREVIOUS_TAG" ]; then
            notes_args+=(-f previous_tag_name="$PREVIOUS_TAG")
          fi
          if changes="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" \
            --jq '.body | sub("^## What.s Changed[[:space:]]*"; "")')" && [ -n "$changes" ]; then
            printf "\n## What's changed\n\n%s\n" "$changes" >> "$notes"
          else
            echo "::warning::Could not generate the What's changed notes. Publishing with the template only."
          fi
          cat "$notes"

          if [ "$DRY_RUN" = true ]; then
            echo "dry_run: skipped publish. No tag or release $TAG (versionCode $VERSION_CODE) was created."
            exit 0
          fi

          # gh uploads the assets to a draft, then publishes it, so nobody
          # sees a release without its APK. --latest=false: the desktop and
          # extension releases in this repo keep the "latest" flag.
          gh release create "$TAG" "$APK" "$RELEASE_JSON" --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --title "vmem $VERSION_NAME" \
            --latest=false \
            --notes-file "$notes"
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vmem-release.p12"
