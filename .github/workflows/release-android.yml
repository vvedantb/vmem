name: Release Android APK

# Thin caller of the shared vvedantb/packages release-android-apk workflow.
# It builds the signed vmem Android sideload APK and publishes it as a GitHub
# Release. dry_run builds and signs the APK but publishes nothing. Secrets and
# versions: apps/mobile/RELEASE.md.
on:
  push:
    branches: [main]
    # Only what goes into the APK: the mobile app, the workspace code that
    # Metro bundles into it, and the install and build inputs. Excluded:
    # web, chrome-extension, desktop, docs, .github/** (this workflow and the
    # notes template, so a CI-only merge never releases) and the Convex
    # backend. The app reaches vmem over HTTP with @vmem/sdk only; @vmem/sdk
    # has no workspace dependencies. pnpm-lock.yaml has no per-app part, so
    # any dependency change releases.
    paths:
      - "apps/mobile/**"
      - "!apps/mobile/tests/**"
      - "!apps/mobile/**/*.md"
      - "!apps/mobile/.env.example"
      - "packages/sdk/package.json"
      - "packages/sdk/src/**"
      - "!packages/sdk/**/*.test.ts"
      # Root package.json holds the packageManager pin and pnpm settings.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "scripts/build-android-release.sh"
  # On push, inputs.* are empty: automatic version, not a dry run, publish.
  workflow_dispatch:
    inputs:
      version:
        description: "versionName, like 1.0.1. Leave empty to bump the patch of the highest published release.json versionName (at least DEFAULT_VERSION_NAME in app.config.ts)."
        required: false
        type: string
      dry_run:
        description: "Build and sign the APK, but skip gh release create (no tag, no release)."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, for push and dispatch runs. The version is chosen
# inside the job, so a queued run sees the release that the run before it
# published. GitHub keeps only the newest pending run and cancels older
# pending ones. The newest run builds the newest main, so it includes the
# skipped merges.
concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  release:
    uses: vvedantb/packages/.github/workflows/release-android-apk.yml@main
    with:
      app_name: vmem
      package_id: com.projectvdotuk.vmem
      version: ${{ inputs.version }}
      # On push, inputs.dry_run is empty, so compare to true for a boolean.
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
