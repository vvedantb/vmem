name: Desktop

# Pull request on the paths below: Linux check build (job `linux`), no release.
# Push to main on the push paths below: release. The `version` job picks the
# version, the installers carry it, and `publish` creates the tag
# `desktop-vX.Y.Z` at the merge commit and the GitHub Release.
# Tag push `desktop-v*`: release for that tag. The installers carry the
# version in apps/desktop/package.json, as before.
# Manual dispatch with a tag: release for that tag, as before. With dry_run:
# build as a release from main does, and publish nothing.
# The tag that a main release creates is made with GITHUB_TOKEN, so it starts
# no second run.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-release.yml"
  push:
    branches: [main]
    tags:
      - "desktop-v*"
    # GitHub checks these paths for branch pushes only; a tag push always runs.
    # Only what goes into the installers: the desktop app, the @vmem/sdk
    # source that esbuild bundles into it (@vmem/sdk has no workspace
    # dependencies), and the install and build inputs. Excluded: tests, docs,
    # the PR-only packaged test script and .github/** (so a CI-only merge never
    # releases). pnpm-lock.yaml and the root package.json are not listed: they
    # have no per-app part, so every dependency change anywhere in the repo
    # would release. A desktop dependency change edits
    # apps/desktop/package.json, which apps/desktop/** matches.
    paths:
      - "apps/desktop/**"
      - "!apps/desktop/tests/**"
      - "!apps/desktop/**/*.md"
      - "!apps/desktop/scripts/packaged-test.mjs"
      - "packages/sdk/package.json"
      - "packages/sdk/src/**"
      - "!packages/sdk/**/*.test.ts"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example desktop-v0.1.0). Not used with dry_run.
        required: true
      dry_run:
        description: "Pick the version and build both installers as a release from main does, but skip the publish job (no tag, no release)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Pull requests share a group per ref and cancel older runs. Every release run
# (main, tag, dispatch) shares one group and is never cancelled while it runs.
# The version is picked inside the run, so a queued run sees the tag that the
# run before it created. GitHub keeps only the newest pending run; that run
# builds the newest main, so it includes the skipped merges.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-{0}', github.ref) || 'desktop-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR check: unit tests, Linux package and a packaged-app smoke run.
  linux:
    if: github.event_name == 'pull_request'
    runs-on: boat-large
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vmem/desktop typecheck
      - run: pnpm --filter @vmem/desktop test
      - run: pnpm --filter @vmem/desktop package:linux
      - name: Install display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox x11-utils xterm
      # Opens the packaged app.asar inside the packaged binary and fails on any
      # missing module, including the bundled get-windows path.
      - run: pnpm --filter @vmem/desktop check:asar
      - name: Smoke test packaged app
        run: |
          out="$(VMEM_DESKTOP_SMOKE=1 xvfb-run -a apps/desktop/release/linux-unpacked/vmem-desktop --no-sandbox)"
          echo "$out"
          echo "$out" | grep -qx VMEM_DESKTOP_SMOKE_OK
      # Real window: openbox + xterm under xvfb, mock vmem API. The packaged app
      # must record a focus event and post a desktop memory about the window.
      - name: Packaged focus test
        run: xvfb-run -a node scripts/packaged-test.mjs
        working-directory: apps/desktop

  # Picks what a release run publishes. A main push (or a dry run) gets the
  # next version: see .github/scripts/pick-release-version.sh. A tag push or a
  # dispatch with a tag keeps that tag and leaves `version` empty, so the
  # installers carry the version in apps/desktop/package.json, as before.
  version:
    if: github.event_name != 'pull_request'
    runs-on: boat-large
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: pick
        env:
          PICK: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.dry_run == true }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$PICK" != "true" ]; then
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            echo "Release for the given tag $tag."
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          source_version="$(jq -r .version apps/desktop/package.json)"
          version="$(bash .github/scripts/pick-release-version.sh desktop-v "$source_version")"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release from main: write the picked version into the build workspace,
      # so the installer name and the app version carry it. Nothing is committed.
      - name: Set release version
        if: needs.version.outputs.version != ''
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n');"
          node -p "require('./package.json').version"
      - run: pnpm --filter @vmem/desktop test
      # pnpm skips get-windows install scripts, so fetch the addon here. It is
      # N-API (ABI stable), so one build works for Electron. Fall back to a
      # source build for the Electron version in package.json, same arch as the
      # runner (x64). scripts/build.mjs copies the .node into dist/native and
      # fails if none exists.
      - name: Fetch get-windows native addon
        shell: bash
        working-directory: apps/desktop
        run: |
          dir="$(node -p "require('node:path').dirname(require.resolve('get-windows'))")"
          electron="$(node -p "require('electron/package.json').version")"
          cd "$dir"
          npx node-pre-gyp install --fallback-to-build \
            --runtime=electron --target="$electron" --target_arch=x64 \
            --dist-url=https://electronjs.org/headers
          ls -l lib/binding/*/*.node build/Release/*.node || true
      # Signs when the WIN_CSC_LINK secret is set (apps/desktop/README.md,
      # Signing). Without it the installer is unsigned.
      - name: Package Windows installer
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$WIN_CSC_LINK" ]; then
            echo "No WIN_CSC_LINK secret: building unsigned."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
          fi
          pnpm --filter @vmem/desktop package:win
      - run: pnpm --filter @vmem/desktop check:asar "release/win-unpacked/vmem.exe"
      - name: Check installer version
        if: needs.version.outputs.version != ''
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ls -l "release/vmem-desktop-$VERSION-"*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos:
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A release from main: write the picked version into the build workspace,
      # so the installer name and the app version carry it. Nothing is committed.
      - name: Set release version
        if: needs.version.outputs.version != ''
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('node:fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n');"
          node -p "require('./package.json').version"
      - run: pnpm --filter @vmem/desktop test
      # get-windows ships a universal Swift binary (`main`). The macOS code does
      # not use the .node addon, so nothing is rebuilt per arch. Fail early if
      # the binary lacks either arch.
      - name: Check get-windows universal binary
        working-directory: apps/desktop
        run: |
          dir="$(node -p "require('node:path').dirname(require.resolve('get-windows'))")"
          archs="$(lipo -archs "$dir/main")"
          echo "$archs"
          echo "$archs" | grep -q x86_64
          echo "$archs" | grep -q arm64
      # Builds x64 (Intel) and arm64 (Apple silicon) dmg files (see
      # package:mac). build.mjs copies `main` into dist/native once, and both
      # arches use it. Signs when the CSC_LINK secret is set, and notarises
      # when the Apple secrets are also set (apps/desktop/README.md, Signing).
      # Without CSC_LINK the dmg files are unsigned and not notarised.
      - name: Package macOS dmg files (arm64 + x64)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "No CSC_LINK secret: building unsigned and not notarised."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm --filter @vmem/desktop package:mac
      - name: Check both dmg files
        working-directory: apps/desktop
        run: |
          ls -l release/*.dmg
          ls release/*-arm64.dmg release/*-x64.dmg
      - name: Check dmg version
        if: needs.version.outputs.version != ''
        working-directory: apps/desktop
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ls -l "release/vmem-desktop-$VERSION-"*-arm64.dmg "release/vmem-desktop-$VERSION-"*-x64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  # Skipped on a dry run. On a release from main the tag does not exist yet,
  # so `gh release create --target` makes it at the merge commit.
  publish:
    needs: [version, windows, macos]
    if: inputs.dry_run != true
    runs-on: boat-large
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          ls -l artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "vmem desktop $TAG" --generate-notes
          fi
