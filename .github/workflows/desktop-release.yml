name: Desktop

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/sdk/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/desktop-release.yml"
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example desktop-v0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PR check: unit tests, Linux package and a packaged-app smoke run.
  linux:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vmem/desktop typecheck
      - run: pnpm --filter @vmem/desktop test
      - run: pnpm --filter @vmem/desktop package:linux
      - name: Smoke test packaged app
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          out="$(VMEM_DESKTOP_SMOKE=1 xvfb-run -a apps/desktop/release/linux-unpacked/vmem-desktop --no-sandbox)"
          echo "$out"
          echo "$out" | grep -qx VMEM_DESKTOP_SMOKE_OK

  windows:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vmem/desktop test
      - run: pnpm --filter @vmem/desktop package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vmem/desktop test
      # Builds x64 and arm64 dmg files (see package:mac).
      - run: pnpm --filter @vmem/desktop package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        run: |
          ls -l artifacts
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "vmem Desktop $TAG" --generate-notes
          fi
