<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Notion mark: white rounded square tile with a black "N" letter. Simplified
    from the official brand to stay legible at ~20-40px sizes on a coloured
    graph node.
  -->
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#ffffff"/>
  <!-- Left vertical stroke -->
  <rect x="17" y="14" width="7" height="36" fill="#000000"/>
  <!-- Right vertical stroke -->
  <rect x="40" y="14" width="7" height="36" fill="#000000"/>
  <!-- Diagonal stroke tying the two verticals into an "N" -->
  <polygon points="17,14 24,14 47,50 40,50" fill="#000000"/>
</svg>
