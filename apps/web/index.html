        <h1>vmem — Memory engine for AI agents</h1>
        <p>Memory your agents can actually use.</p>
        <p>
          Store context from chats and tools, connect it in a graph, and
          retrieve the slice that matters — with a Context Trace that shows why
          each memory matched.
        </p>
        <h2>How it works</h2>
        <ul>
          <li>
            <strong>Store</strong> — Capture context from chat, tools, and HTTP
            — tagged by profile, so workspaces stay separate.
          </li>
          <li>
            <strong>Connect</strong> — Memories link in a graph. Relationships
            survive between sessions instead of sitting in a flat list.
          </li>
          <li>
            <strong>Recall</strong> — Agents pull the right slice via MCP,
            skills, or the API — and get a Context Trace with the answer.
          </li>
        </ul>
        <h2>Features</h2>
        <ul>
          <li>
            Graph-native memory — See context as a network, not a flat list.
          </li>
          <li>
            Built for recall — Episodic, knowledge, and profile memories that
            persist.
          </li>
          <li>Agent-ready — MCP, HTTP API, and skills your agents can call.</li>
        </ul>
        <h2>Surfaces</h2>
        <p>MCP, HTTP, and an SDK on the same graph.</p>
        <p>
          <a href="https://vmem.vedantb.com/">Get started with vmem</a>
