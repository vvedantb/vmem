appId: uk.projectv.vmem.desktop
productName: vmem
# Names and updates. Users see "vmem" (installer, Start Menu, Applications,
# About). Three things stay stable so existing installs and CI keep working:
# - appId stays uk.projectv.vmem.desktop, so a future updater still matches
#   installed copies.
# - extraMetadata.name and linux.executableName stay vmem-desktop, so the Linux
#   binary is release/linux-unpacked/vmem-desktop (the CI smoke test runs it).
# - artifactName stays vmem-desktop-${version}-${os}-${arch}.${ext}, so GitHub
#   release asset names do not change.
# There is no electron-updater, `publish` block or latest*.yml in this repo.
# Releases are GitHub artifacts from .github/workflows/desktop-release.yml, so
# the productName change renames no update feed. The userData folder is still
# "vmem Desktop": main.ts sets it explicitly after app.setName("vmem").
# `dependencies: {}` stops electron-builder from collecting get-windows and zod
# from node_modules: scripts/build.mjs bundles the main process into dist/.
extraMetadata:
  name: vmem-desktop
  productName: vmem
  dependencies: {}
directories:
  output: release
files:
  - dist/**
  - assets/**
  - package.json
# Native files that build.mjs copies into dist/native must be real files.
asarUnpack:
  - dist/native/**
# Returns false: electron-builder neither collects nor rebuilds node_modules.
# This replaces `npmRebuild: false`, which returns before beforeBuild runs and
# so still collects node_modules from the pnpm tree. Natives are copied by
# build.mjs, so no rebuild is needed.
beforeBuild: scripts/skip-node-modules.mjs
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  target:
    - target: dmg
      arch: [x64, arm64]
  extendInfo:
    NSAppleEventsUsageDescription: vmem reads the active window title.
linux:
  executableName: vmem-desktop
  target: dir
  category: Utility
  icon: assets/icon.png
artifactName: vmem-desktop-${version}-${os}-${arch}.${ext}
